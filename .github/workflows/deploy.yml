name: Deploy to Lambda

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build bootstrap binary
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bootstrap .

      - name: Package artifact
        run: zip function.zip bootstrap

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy to Lambda
        run: aws lambda update-function-code --function-name arushiahmed-site-api --zip-file fileb://function.zip

      - name: Wait for deployment to finish
        run: aws lambda wait function-updated-v2 --function-name arushiahmed-site-api
